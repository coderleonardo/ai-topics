# skills.example.conf
#
# Configuration file for scripts/install_skills.sh
#
# - Lines starting with "#" are comments (also used here as category labels
#   for readability) and are ignored by the script.
# - Blank lines are ignored.
# - A line of the form SOURCE_REPO="owner/repo" sets which GitHub repo skills
#   are installed from via `gh skill install`. It can be overridden at
#   runtime with --repo <owner/repo>.
# - Every other non-empty, non-comment line is treated as one skill name.
#
# Copy this file, point --config at your copy, and list whatever skills you
# want installed from whatever repo hosts them. What follows below is just an
# example bundle (a scientific-computing skill collection) to show the format
# and to work out of the box if you don't have your own bundle yet.

SOURCE_REPO="K-Dense-AI/scientific-agent-skills"

# Machine Learning & Deep Learning
torch-geometric
pytorch-lightning
scikit-learn
transformers
stable-baselines3
pymc
shap
aeon
umap-learn
